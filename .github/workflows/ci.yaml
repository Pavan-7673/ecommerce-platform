on:
    push:
        branches:
            - main
permissions:
    contents: read
    id-token: write
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
           - name: Checkout code
             uses: actions/checkout@v4
           - name: Setup jave 17
             uses: actions/setup-java@v4
             with:
                java-version: '17'
                distribution: 'temurin'
           - name: Check java version
             run: java -version
           - name: Check maven version
             run: mvn -version
           - name: Run maven tests
             working-directory: backend
             run: mvn test
           - name: Build Application
             working-directory: backend
             run: mvn package
           - name: login to docker
             uses: docker/login-action@v3
             with:
                username: ${{secrets.DOCKER_USERNAME}}
                password: ${{secrets.DOCKER_PASSWORD}}
           - name: Build docker image
             working-directory: backend
             run: docker build -t ${{secrets.DOCKER_USERNAME}}/ecommerce-platform:${{github.sha}} .
           - name: Push docker image
             working-directory: backend
             run: docker push ${{secrets.DOCKER_USERNAME}}/ecommerce-platform:${{github.sha}}
           - name: Configure AWS credentials
             uses: aws-actions/configure-aws-credentials@v4
             with:
                role-to-assume: arn:aws:iam::542697646801:role/GitHubActions-EKS-Role
                aws-region: ap-south-1
           - name: Verify aws identity
             run: aws sts get-caller-identity